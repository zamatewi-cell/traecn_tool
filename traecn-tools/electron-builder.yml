appId: com.traecn.tools
productName: TraeCN Tools
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: "../trae-proxy.exe"
    to: "bin/trae-proxy.exe"
    filter:
      - "**/*"
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "TraeCN.Tools_${version}_x64-setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TraeCN Tools
  uninstallDisplayName: TraeCN Tools
